name: Build Windows EXE

on:
  push:
    branches: [main]
    paths:
      - "windows/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check files
        shell: pwsh
        run: |
          Get-ChildItem | Select-Object Name
          $need = "main.py","engine.py","fs.py","store.py","agent.py","audio_io.py","chat.py","sounds.py"
          $missing = $need | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            Write-Error "Ye files windows/ folder mein nahi mili: $($missing -join ', ')"
            exit 1
          }

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed --name AICallGuard --paths .
          --hidden-import fs --hidden-import store --hidden-import agent
          --hidden-import audio_io --hidden-import engine
          --hidden-import chat --hidden-import sounds
          --collect-all customtkinter --collect-all aiortc --collect-all av
          --collect-all aioice --collect-all pylibsrtp --collect-all vosk
          --collect-all sounddevice --collect-all _sounddevice_data
          --collect-all edge_tts --collect-all google_crc32c --collect-all PIL
          --hidden-import _cffi_backend main.py

      - name: Verify EXE exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/AICallGuard.exe")) {
            Write-Error "dist/AICallGuard.exe nahi bana!"
            exit 1
          }

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-${{ github.run_number }}
          name: AI Call Guard Windows EXE #${{ github.run_number }}
          files: windows/dist/AICallGuard.exe
